# =============================================================
#  카페 게스트 구인글 알림 설정
# =============================================================

# 확인 주기(분). 내장 루프로 돌릴 때 사용. 기본 60분(1시간).
interval_minutes: 60

# 텔레그램 옵션 (토큰/chat_id 는 .env 에 있음)
telegram:
  disable_web_page_preview: false

# -------------------------------------------------------------
#  키워드 매칭 규칙
#  - all_groups: 그룹 목록. "모든 그룹"에서 각각 최소 1개 단어가
#                글 제목/미리보기에 있으면 매칭 (AND of OR).
#  - exclude:    이 단어가 하나라도 있으면 알림 제외.
#  ※ 대소문자/공백은 무시하고 비교합니다.
# -------------------------------------------------------------
match:
  all_groups:
    # (1) 게스트 관련
    - ["게스트", "게스트구인", "겟", "guest"]
    # (2) 구인 관련
    - ["구인", "구합니다", "구해요", "구함", "모집", "찾습니다", "찾아요", "모셔요"]
    # (3) 주말(토/일) — '오늘'/'내일'은 아래 relative_weekend 로 요일에 맞춰 자동 추가
    #   ※ 홑글자 '일'은 '내일/매일/생일/일정'과 부분일치하므로 넣지 않고,
    #     대신 '일요'(일요일)를 사용. 홑글자 '토'는 '토/일','토 6시' 표기를 위해 유지.
    - ["토", "토요일", "일요일", "일요", "주말", "토일", "주말게스트"]
    # (4) 지역
    - ["인천", "경기", "김포", "서구", "부평", "부천"]
    # (5) 시간대(오전 6~9시) — 다양한 표기 형식 포함
    - ["6시", "7시", "8시", "9시", "06시", "07시", "08시", "09시",
       "06", "07", "08", "09", "6", "7", "8", "9",
       "6:", "7:", "8:", "9:", "오전", "아침", "새벽"]
  exclude: ["마감", "구인완료", "모집완료", "완료", "구했습니다", "구했어요"]

  # 상대 날짜 키워드: 글에 '오늘'/'내일'만 있고 요일이 안 적힌 경우를 위해,
  # '실행하는 날의 요일'을 계산해 주말일 때만 (3)번 주말 그룹에 추가한다.
  #   - '오늘'  → 실행일이 토/일 일 때만 주말로 인정
  #   - '내일'  → 실행일이 금/토 일 때만(=내일이 토/일) 주말로 인정
  # weekend_group_index 는 위 all_groups 에서 주말 그룹의 순서(0부터 시작). (3)번이면 2.
  relative_weekend:
    weekend_group_index: 2
    today: ["오늘", "금일"]
    tomorrow: ["내일", "명일"]

# -------------------------------------------------------------
#  크롤링 대상 카페 게시판
#  - url:       게시판(글 목록) 주소
#  - link_pattern: 글 상세 링크를 골라내는 정규식(부분 일치).
#                  아래 기본값은 대부분 동작하지만, --debug 로 실제
#                  링크를 확인해 필요시 조정하세요.
# -------------------------------------------------------------
sites:
  - name: "네이버 동가리 카페"
    type: naver
    url: "https://cafe.naver.com/f-e/cafes/10586238/menus/34"
    link_pattern: "/cafes/10586238/articles/\\d+"

  - name: "다음 동가리 카페"
    type: daum
    url: "https://m.cafe.daum.net/dongarry/Dilr?boardType="
    link_pattern: "/dongarry/[A-Za-z0-9]+/\\d+"
