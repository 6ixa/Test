# =============================================================
#  카페 게스트 구인글 알림 설정
# =============================================================

# 확인 주기(분). 내장 루프로 돌릴 때 사용.
interval_minutes: 30

# 텔레그램 옵션 (봇 토큰은 .env 의 TELEGRAM_BOT_TOKEN 에 넣으세요)
telegram:
  chat_id: "8808177933"          # 알림 받을 대상. .env 의 TELEGRAM_CHAT_ID 가 있으면 그게 우선
  disable_web_page_preview: false

# 크롤링/부하 제어
scraping:
  pages: 2               # 게시판 몇 페이지까지 확인할지(최근 글 기준)
  max_body_fetches: 20   # 한 사이클·사이트당 본문 조회 상한(차단 방지)
  body_delay_ms: 800     # 본문 조회 사이 대기(ms)
  # 제목에 이 단어가 들어간 글은 목록에서 제외(공지/필독/안내 등 상단 고정글).
  skip_title_contains: ["공지", "필독", "안내"]

# -------------------------------------------------------------
#  키워드 매칭 규칙 (2단계 필터)
#
#  groups: 이름이 붙은 키워드 묶음. 각 그룹은 OR(단어 중 하나라도),
#          요구 그룹들 간에는 AND(모두 만족) 로 판정.
#
#  1단계 title_require : '제목'에 이 그룹들이 모두 있으면 → 본문을 확인
#  2단계 body_require  : '제목+본문' 전체에 이 그룹들이 모두 있으면 → 알림
#
#  → 제목은 '지역+날짜'로 느슨하게 거르고(불필요한 본문 조회 최소화),
#    자세한 시간·장소·날짜·지역은 본문에서 최종 확인.
#  ※ 대소문자는 무시하고 부분일치로 비교합니다.
# -------------------------------------------------------------
match:
  scan_body: true   # false 로 두면 제목만으로 판정(본문 조회 안 함)

  groups:
    # 게스트
    guest: ["게스트", "게스트구인", "겟", "guest"]
    # 구인
    recruit: ["구인", "구합니다", "구해요", "구함", "모집", "찾습니다", "찾아요", "모셔요"]
    # 주말(토/일) — '오늘'/'내일'은 relative_weekend 로 요일에 맞춰 자동 추가.
    #   ※ 홑글자 '일'은 '내일/매일/생일/일산'과 부분일치하므로 넣지 않고,
    #     '일요'(일요일)와 괄호 표기 '(일)'/'(토)' 를 사용. (예: "07월26(일)")
    #     홑글자 '토'는 '토/일','토 6시' 표기를 위해 유지.
    weekend: ["토", "토요일", "일요일", "일요", "주말", "토일", "주말게스트",
              "(토)", "(일)", "(토요일)", "(일요일)"]
    # 지역
    region: ["인천", "경기", "김포", "서구", "부평", "부천"]
    # 시간대(오전 6~9시) — 다양한 표기 형식 포함
    time: ["6시", "7시", "8시", "9시", "06시", "07시", "08시", "09시",
           "06", "07", "08", "09", "6", "7", "8", "9",
           "6:", "7:", "8:", "9:", "오전", "아침", "새벽"]

  # 1단계: 제목에 지역+날짜(주말)가 있으면 본문 확인 대상
  title_require: ["region", "weekend"]

  # 2단계: 제목+본문에 아래가 모두 있어야 최종 알림
  body_require: ["guest", "recruit", "weekend", "region", "time"]

  exclude: ["마감", "구인완료", "모집완료", "완료", "구했습니다", "구했어요"]

  # 상대 날짜 키워드: 글에 '오늘'/'내일'만 있고 요일이 안 적힌 경우를 위해,
  # '실행하는 날의 요일'을 계산해 주말일 때만 weekend 그룹에 추가한다.
  #   - '오늘'  → 실행일이 토/일 일 때만 주말로 인정
  #   - '내일'  → 실행일이 금/토 일 때만(=내일이 토/일) 주말로 인정
  relative_weekend:
    group: weekend
    today: ["오늘", "금일"]
    tomorrow: ["내일", "명일"]

# -------------------------------------------------------------
#  크롤링 대상 카페 게시판
#  - url:           게시판(글 목록) 주소
#  - link_pattern:  글 상세 링크를 골라내는 정규식(부분 일치).
#  - body_selector: 본문 영역 CSS 선택자. 비우면 페이지 전체 텍스트 사용.
#                   --debug 로 실제 페이지를 보고 필요시 조정하세요.
# -------------------------------------------------------------
sites:
  - name: "네이버 농심 카페"
    type: naver
    url: "https://cafe.naver.com/f-e/cafes/10586238/menus/34"
    link_pattern: "/cafes/10586238/articles/\\d+"
    body_selector: ".article_viewer, .se-main-container, #app"

  - name: "다음 동아리 농구방"
    type: daum
    # PC(cafe.daum.net)는 게시판을 iframe/SPA 로 띄워 자동 읽기가 어려움 →
    # 서버 렌더링되는 모바일(m.cafe.daum.net) 을 대상으로 함.
    url: "https://m.cafe.daum.net/dongarry/Dilr?boardType="
    link_pattern: "/dongarry/[A-Za-z0-9]+/\\d+"
    body_selector: "#article, .article_view, .cafe_article"
    page_param: "&page={page}"   # 2페이지 이상 확인 시 붙이는 파라미터(--debug 로 확인·조정)
